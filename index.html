<style>
:root{--bg:#faf7f2;--card:#fff;--text:#333;--accent:#e07a3f;--line:#e8e2d8;--muted:#888}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1e1e1e;--card:#2a2a2a;--text:#eee;--line:#3a3a3a;--muted:#aaa}}
:root[data-theme="dark"]{--bg:#1e1e1e;--card:#2a2a2a;--text:#eee;--line:#3a3a3a;--muted:#aaa}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);max-width:640px;margin-inline:auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 0}
h1{font-size:20px;margin:0}
h2{font-size:18px;margin:0 0 6px}
h3{font-size:15px;margin:14px 0 6px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.sel{outline:2px solid var(--accent);outline-offset:1px}
.tabs{display:flex;gap:8px;margin:8px 0 12px}
.tabs button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line)}
.tabs button.sel{background:var(--accent);color:#fff;outline:none}
.list{display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.card .name{font-weight:600}
.genre{font-size:12px;color:var(--accent);margin-right:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.chk{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:20px;font-size:14px;background:var(--card)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0}
.panel h3{margin:0 0 8px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px}
ul,ol{padding-left:20px;margin:6px 0}
li{margin:3px 0}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:1px 8px;margin:2px 4px 0 0}
[hidden]{display:none!important}
</style>
</head>

<header>

  </div>
  <div id="allergyArea"></div>
  <div class="row" style="margin-top:12px">
    <button id="btnSaveSetup" style="flex:1">保存して始める</button>
    <button class="ghost" id="btnBack" hidden>戻る</button>
  </div>
</section>

  <div class="list" id="menuList"></div>
</section>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

  {id:119,g:'中',name:'肉まん',time:40,tags:['小麦','大豆'],ing:[['強力粉',60,'g'],['ドライイースト',1,'g'],['砂糖',5,'g',1],['水',35,'ml'],['豚ひき肉',50,'g'],['長ねぎ',10,'g'],['醤油',3,'ml',1],['ごま油',2,'ml']],steps:['粉・イースト・砂糖・水をこねて一次発酵させる（約1時間）。具は炒めて冷ましておく。','生地で具を包み、蒸し器で12分ほど蒸す。']},
  {id:120,g:'中',name:'鶏手羽のピリ辛煮',time:30,tags:['大豆'],ing:[['鶏手羽元',3,'本'],['醤油',6,'ml',1],['砂糖',5,'g',1],['酒',10,'ml',1],['豆板醤',2,'g',1],['水',100,'ml'],['しょうが',3,'g']],steps:['手羽元を焼いて焼き色をつける。','水と調味料、しょうがを加え、落としぶたをして20分煮る。']},
  {id:121,g:'中',name:'麻辣豆腐',time:15,tags:['大豆'],ing:[['絹ごし豆腐',150,'g'],['豚ひき肉',40,'g'],['豆板醤',2,'g',1],['花椒',0.3,'g',1],['醤油',5,'ml',1],['水',80,'ml'],['片栗粉',3,'g'],['ラー油',3,'ml']],steps:['豚ひき肉と豆板醤を炒め、水と醤油を加える。','豆腐を入れて煮て、水溶き片栗粉でとろみをつける。花椒とラー油をかける。']},
  {id:122,g:'中',name:'棒棒鶏',time:25,tags:['大豆'],ing:[['鶏むね肉',80,'g'],['きゅうり',20,'g'],['ごまだれ',15,'ml',1],['醤油',3,'ml',1],['酢',3,'ml',1],['砂糖',2,'g',1],['ラー油',2,'ml'],['塩',0.5,'g',1]],steps:['鶏肉に酒と塩をふり、蒸すか茹でて冷まし、裂く。','きゅうりを千切りにして鶏と盛り、ごまだれと調味料を合わせてかける。']},
  {id:123,g:'中',name:'ピーマンの肉詰め',time:25,tags:['卵','小麦','大豆'],ing:[['ピーマン',2,'個'],['豚ひき肉',60,'g'],['玉ねぎ',10,'g'],['片栗粉',3,'g'],['醤油',3,'ml',1],['オイスターソース',3,'g',1],['卵',0.3,'個'],['サラダ油',5,'ml']],steps:['ピーマンを半分に切り、内側に片栗粉をふる。玉ねぎと肉を混ぜたタネを詰める。','肉側から焼き、焼き色がついたら蓋をして蒸し焼きにする。調味料で味を整える。']}

  {id:124,g:'和',name:'さばの塩焼き',time:15,tags:[],ing:[['さば切り身',100,'g'],['塩',1,'g',1],['大根おろし',30,'g'],['レモン',10,'g']],steps:['さばに塩をふり、10分ほどおいて水気を拭く。','グリルで皮目からこんがり焼く。大根おろしとレモンを添える。']},
  {id:125,g:'和',name:'ぶりの照り焼き',time:20,tags:['大豆','小麦'],ing:[['ぶり切り身',100,'g'],['醤油',8,'ml',1],['みりん',8,'ml',1],['砂糖',3,'g',1],['サラダ油',3,'ml']],steps:['ぶりは表面の水気を拭く。','皮目から焼き、焼き色がついたら合わせ調味料を加えて照りが出るまで絡める。']},
  {id:126,g:'和',name:'肉豆腐',time:20,tags:['大豆'],ing:[['牛薄切り肉',60,'g'],['豆腐',100,'g'],['長ねぎ',15,'g'],['だし汁',120,'ml'],['醤油',8,'ml',1],['みりん',8,'ml',1],['砂糖',4,'g',1]],steps:['豆腐は大きめに切り、長ねぎは斜めに切る。','だし汁と調味料で牛肉と長ねぎを煮て、豆腐を加えて味を含ませる。']},
  {id:127,g:'和',name:'さつまいもの甘煮',time:25,tags:[],ing:[['さつまいも',1,'本'],['水',100,'ml'],['砂糖',10,'g',1],['醤油',2,'ml',1],['塩',0.3,'g',1]],steps:['さつまいもは1cm幅の輪切りにし、水にさらす。','水と砂糖を入れ、柔らかくなるまで弱火で煮て、最後に醤油と塩で味を整える。']},
  {id:128,g:'和',name:'もずくの酢の物',time:5,tags:[],ing:[['味付けもずく',60,'g'],['きゅうり',20,'g'],['酢',8,'ml',1],['砂糖',2,'g',1],['醤油',2,'ml',1]],steps:['きゅうりは薄切りにして塩もみし、水気を絞る。','酢・砂糖・醤油を混ぜ、もずくときゅうりを和える。']},
  {id:129,g:'和',name:'小松菜のおかか和え',time:10,tags:['大豆'],ing:[['小松菜',80,'g'],['かつお節',1,'g'],['醤油',4,'ml',1],['砂糖',1,'g',1]],steps:['小松菜を茹でて冷水にとり、水気を絞って3cmに切る。','醤油と砂糖で和え、かつお節をかける。']},
  {id:130,g:'和',name:'鶏のみぞれ煮',time:25,tags:['大豆','小麦'],ing:[['鶏もも肉',100,'g'],['片栗粉',3,'g'],['大根おろし',60,'g'],['だし汁',100,'ml'],['醤油',6,'ml',1],['みりん',6,'ml',1],['酒',3,'ml',1]],steps:['鶏肉に片栗粉をまぶし、油を引かずに皮目から焼く。','だし汁と調味料を煮立て、鶏肉を入れて5分煮る。大根おろしを加えて火を止める。']},
  {id:131,g:'和',name:'牛丼',time:20,tags:['大豆','小麦'],ing:[['牛薄切り肉',80,'g'],['玉ねぎ',25,'g'],['だし汁',50,'ml'],['醤油',8,'ml',1],['みりん',8,'ml',1],['砂糖',5,'g',1],['ご飯',150,'g']],steps:['玉ねぎを薄切りにする。','だし汁と調味料で玉ねぎを煮て、牛肉を加えて煮汁が少なくなるまで煮る。ご飯にのせる。']},
  {id:132,g:'和',name:'ほたてとキャベツのバター醤油炒め',time:10,tags:['乳','大豆'],ing:[['ほたて貝柱',60,'g'],['キャベツ',60,'g'],['バター',5,'g'],['醤油',5,'ml',1],['塩',0.5,'g',1],['黒こしょう',0.2,'g',1]],steps:['キャベツはざく切りにする。','バターで貝柱とキャベツを強火で炒め、醤油と塩こしょうで味を整える。']},
  {id:133,g:'和',name:'さつま揚げの煮物',time:20,tags:['大豆','小麦'],ing:[['さつま揚げ',2,'枚'],['大根',50,'g'],['にんじん',15,'g'],['だし汁',150,'ml'],['醤油',6,'ml',1],['みりん',6,'ml',1],['砂糖',3,'g',1]],steps:['大根とにんじんは乱切りにし、さつま揚げは熱湯をかけて油抜きする。','だし汁と調味料で野菜を柔らかく煮て、さつま揚げを加えて味を含ませる。']},
  {id:134,g:'和',name:'ミートボールの甘辛煮',time:25,tags:['卵','大豆','小麦'],ing:[['豚ひき肉',80,'g'],['玉ねぎ',10,'g'],['パン粉',5,'g'],['卵',0.3,'個'],['醤油',6,'ml',1],['みりん',6,'ml',1],['砂糖',4,'g',1],['水',50,'ml']],steps:['玉ねぎはみじん切りにし、肉・パン粉・卵と練り混ぜて丸める。','フライパンで焼き色をつけ、水と調味料を加えて照りが出るまで煮る。']},
  {id:135,g:'和',name:'かき玉汁',time:10,tags:['卵','大豆'],ing:[['卵',0.5,'個'],['だし汁',200,'ml'],['醤油',3,'ml',1],['塩',0.5,'g',1],['小ねぎ',3,'g']],steps:['だし汁に調味料を入れて煮立てる。','溶き卵を細く回し入れ、ふんわりしたら小ねぎを散らす。']},
  {id:136,g:'洋',name:'ローストチキン',time:60,tags:[],ing:[['鶏もも肉',150,'g'],['にんにく',2,'g'],['ローズマリー',0.5,'g'],['塩',1,'g',1],['黒こしょう',0.5,'g',1],['オリーブオイル',5,'ml'],['じゃがいも',30,'g']],steps:['鶏肉に塩こしょう・オイル・にんにく・ローズマリーをもみ込み、30分ほどおく。','じゃがいもと一緒に天板にのせ、200℃のオーブンで30分ほど焼く。']},
  {id:137,g:'洋',name:'ひよこ豆のサラダ',time:10,tags:[],ing:[['ひよこ豆（水煮）',60,'g'],['きゅうり',20,'g'],['トマト',40,'g'],['玉ねぎ',10,'g'],['オリーブオイル',5,'ml'],['レモン汁',3,'ml'],['塩',0.5,'g',1],['黒こしょう',0.2,'g',1]],steps:['野菜は1cm角に切り、玉ねぎは水にさらして辛みを抜く。','ひよこ豆と野菜を合わせ、オイル・レモン汁・塩こしょうで和える。']},
  {id:138,g:'洋',name:'オニオングラタンスープ',time:40,tags:['乳','小麦'],ing:[['玉ねぎ',100,'g'],['バター',5,'g'],['小麦粉',2,'g'],['コンソメ',3,'g',1],['水',200,'ml'],['バゲット',20,'g'],['ピザ用チーズ',15,'g']],steps:['玉ねぎを薄切りにし、バターで飴色になるまで弱火で炒める。','小麦粉・コンソメ・水を加えて煮込み、器に入れてバゲットとチーズをのせて焼く。']},
  {id:139,g:'洋',name:'ポテトのチーズ焼き',time:25,tags:['乳'],ing:[['じゃがいも',1,'個'],['ベーコン',15,'g'],['玉ねぎ',20,'g'],['ピザ用チーズ',25,'g'],['生クリーム',20,'ml'],['塩',0.5,'g',1],['黒こしょう',0.2,'g',1]],steps:['じゃがいもは薄切りにして電子レンジで柔らかくする。玉ねぎとベーコンは炒める。','耐熱皿にじゃがいも・具を重ね、生クリームと塩こしょうをかけてチーズをのせ、焼き色がつくまで焼く。']},
  {id:140,g:'洋',name:'ビーフカレー',time:50,tags:['小麦'],ing:[['牛肉（カレー用）',80,'g'],['玉ねぎ',40,'g'],['にんじん',20,'g'],['じゃがいも',40,'g'],['トマト缶',40,'g'],['水',150,'ml'],['カレールウ',25,'g'],['サラダ油',3,'ml']],steps:['玉ねぎを飴色になるまで炒め、牛肉を加えて焼き色をつける。','野菜・トマト缶・水を加えて煮込み、野菜が柔らかくなったらルウを溶かし入れる。']},
  {id:141,g:'洋',name:'ソーセージとじゃがいものソテー',time:15,tags:[],ing:[['ウインナー',60,'g'],['じゃがいも',1,'個'],['玉ねぎ',20,'g'],['オリーブオイル',5,'ml'],['塩',0.5,'g',1],['粒マスタード',3,'g',1]],steps:['じゃがいもは薄切りにして、電子レンジで柔らかくする。','オイルでウインナー・じゃがいも・玉ねぎを焼き色がつくまで炒め、塩と粒マスタードで味を整える。']},
  {id:142,g:'洋',name:'えびのアヒージョ',time:15,tags:['えび'],ing:[['むきえび',80,'g'],['ニンニク',2,'g'],['オリーブオイル',20,'ml'],['鷹の爪',0.5,'本'],['塩',0.5,'g',1],['パセリ',1,'g']],steps:['小さめの鍋にオイル・薄切りニンニク・鷹の爪を入れ、弱火で香りを出す。','えびを加えて火が通るまで煮て、塩で味を整えパセリを散らす。']},
  {id:143,g:'洋',name:'スパニッシュオムレツ',time:25,tags:['卵'],ing:[['卵',2,'個'],['じゃがいも',1,'個'],['玉ねぎ',20,'g'],['ベーコン',15,'g'],['オリーブオイル',8,'ml'],['塩',0.5,'g',1],['黒こしょう',0.2,'g',1]],steps:['じゃがいもと玉ねぎを薄切りにして、オイルで柔らかくなるまで炒める。ベーコンも加える。','溶き卵と塩こしょうを入れて全体をなじませ、弱火で蓋をして半熟に焼く。']},
  {id:144,g:'洋',name:'ミックスピザ',time:30,tags:['小麦','乳'],ing:[['ピザ生地',1,'枚'],['トマトソース',30,'g'],['ピザ用チーズ',40,'g'],['ウインナー',20,'g'],['玉ねぎ',15,'g'],['ピーマン',10,'g'],['オリーブオイル',3,'ml']],steps:['具材を薄切りにして生地にのせ、トマトソースとチーズをのせる。','オーブンで230℃に予熱して、チーズがとろけ焼き色がつくまで10分ほど焼く。']},
  {id:145,g:'洋',name:'タコライス',time:15,tags:['大豆'],ing:[['合挽き肉',80,'g'],['玉ねぎ',15,'g'],['トマト',30,'g'],['レタス',20,'g'],['ピザ用チーズ',20,'g'],['ご飯',150,'g'],['ケチャップ',10,'g',1],['ウスターソース',5,'ml',1],['カレー粉',0.5,'g',1],['塩',0.5,'g',1]],steps:['玉ねぎと肉を炒め、ケチャップ・ソース・カレー粉・塩で味をつける。','ご飯にレタス・トマト・チーズと肉をのせる。']},
  {id:146,g:'洋',name:'チーズフォンデュ',time:20,tags:['乳','小麦'],ing:[['ピザ用チーズ',80,'g'],['牛乳',80,'ml'],['白ワイン',20,'ml'],['片栗粉',3,'g'],['バゲット',40,'g'],['ブロッコリー',40,'g'],['ウインナー',20,'g']],steps:['鍋に牛乳と白ワインを温め、チーズを少しずつ溶かす。片栗粉を水で溶いて加え、とろみをつける。','バゲット・ブロッコリー・ウインナーをつけて食べる。']},
  {id:147,g:'洋',name:'ラムのグリル',time:25,tags:[],ing:[['ラムチョップ',2,'本'],['塩',0.5,'g',1],['黒こしょう',0.3,'g',1],['ニンニク',1,'g'],['オリーブオイル',5,'ml'],['ミニトマト',30,'g']],steps:['ラムに塩こしょうをふり、ニンニクをすりつけて30分ほどおく。','フライパンで両面を強火で焼き、ミニトマトを添える。']},
  {id:148,g:'中',name:'天津飯',time:15,tags:['卵','大豆'],ing:[['卵',2,'個'],['ご飯',150,'g'],['カニカマ',20,'g'],['鶏がらスープの素',1,'g',1],['水',80,'ml'],['醤油',3,'ml',1],['片栗粉',3,'g'],['サラダ油',5,'ml']],steps:['溶き卵にカニカマを混ぜ、油で半熟に焼いてご飯にのせる。','鶏がらスープ・醤油・水溶き片栗粉でとろみあんを作り、かける。']},
  {id:149,g:'中',name:'かに玉',time:10,tags:['卵','かに'],ing:[['卵',2,'個'],['かに風味かまぼこ',20,'g'],['長ねぎ',5,'g'],['鶏がらスープの素',1,'g',1],['塩',0.5,'g',1],['サラダ油',5,'ml']],steps:['卵・かに風味かまぼこ・ねぎ・塩を混ぜ、油で大きく混ぜながら焼く。','鶏がらスープの素を少量の湯で溶いたものを、かけて仕上げる。']},
  {id:150,g:'中',name:'ワンタンスープ',time:20,tags:['小麦','卵'],ing:[['ワンタンの皮',6,'枚'],['豚ひき肉',20,'g'],['ほうれん草',20,'g'],['鶏がらスープの素',2,'g',1],['水',200,'ml'],['醤油',3,'ml',1],['ごま油',2,'ml']],steps:['豚肉と調味料を混ぜて具を作り、皮で包む。','湯を沸かしてワンタンを茹で、鶏がらスープ・醤油で味を整えたスープに入れてほうれん草を加える。']},
  {id:151,g:'中',name:'チャプチェ',time:20,tags:['大豆','卵'],ing:[['春雨',30,'g'],['牛薄切り肉',50,'g'],['ピーマン',15,'g'],['にんじん',10,'g'],['卵',0.5,'個'],['醤油',6,'ml',1],['砂糖',3,'g',1],['ごま油',4,'ml']],steps:['春雨は茹でて水気を切り、食べやすく切る。','牛肉と野菜を炒め、春雨と調味料を加えて手早く絡める。'] },
  {id:152,g:'中',name:'ジャージャー麺',time:20,tags:['小麦','大豆'],ing:[['中華麺',1,'玉'],['豚ひき肉',60,'g'],['甜麺醤',10,'g',1],['醤油',3,'ml',1],['砂糖',3,'g',1],['水',100,'ml'],['きゅうり',20,'g'],['長ねぎ',10,'g']],steps:['豚ひき肉を炒め、甜麺醤・醤油・砂糖・水を加えて煮詰める。','茹でた麺にみそあんと千切りのきゅうり・ねぎをのせ、混ぜて食べる。']},
  {id:153,g:'中',name:'鶏ときゅうりの塩だれ',time:10,tags:['大豆'],ing:[['鶏むね肉',100,'g'],['きゅうり',30,'g'],['長ねぎ',10,'g'],['ごま油',4,'ml'],['醤油',4,'ml',1],['酢',3,'ml',1],['砂糖',2,'g',1],['白ごま',1,'g']],steps:['鶏むね肉は酒をふって蒸すか茹でて、冷まして裂く。','きゅうりは千切りにし、ねぎ・調味料と和えて鶏肉に合わせ、白ごまを散らす。']},
  {id:154,g:'中',name:'スブタ',time:20,tags:['小麦','大豆'],ing:[['豚ロース',80,'g'],['玉ねぎ',20,'g'],['ピーマン',15,'g'],['片栗粉',8,'g'],['砂糖',6,'g',1],['酢',6,'ml',1],['醤油',4,'ml',1],['ケチャップ',8,'g',1],['サラダ油',5,'ml']],steps:['豚肉に片栗粉をまぶし、油で揚げ焼きにする。','野菜を炒め、調味料を煮立てて肉を戻し、手早く絡める。']},
  {id:155,g:'中',name:'生春巻き',time:20,tags:['えび'],ing:[['ライスペーパー',2,'枚'],['むきえび',40,'g'],['レタス',20,'g'],['きゅうり',20,'g'],['春雨',15,'g'],['甜麺醤',5,'g',1],['ごま油',1,'ml']],steps:['えびは茹でて半分に切り、野菜と春雨を用意する。','ライスペーパーを水で戻し、具をのせて包む。甜麺醤を添える。']},
  {id:156,g:'中',name:'油淋鶏',time:25,tags:['小麦','大豆'],ing:[['鶏もも肉',120,'g'],['片栗粉',8,'g'],['長ねぎ',10,'g'],['醤油',6,'ml',1],['酢',6,'ml',1],['砂糖',4,'g',1],['ごま油',3,'ml'],['揚げ油',20,'ml']],steps:['鶏肉に片栗粉をまぶし、皮目から揚げて火を通す。','長ねぎ・醤油・酢・砂糖・ごま油を合わせたタレを、食べやすく切った鶏にかける。']},
  {id:157,g:'中',name:'えびの塩炒め',time:10,tags:['えび'],ing:[['むきえび',80,'g'],['片栗粉',3,'g'],['長ねぎ',10,'g'],['塩',0.5,'g',1],['酒',5,'ml',1],['ごま油',3,'ml'],['鶏がらスープの素',1,'g',1]],steps:['えびに片栗粉をまぶし、油で炒めて取り出す。','ねぎを炒め、えびを戻して酒・塩・鶏がらの素で味を整える。']},
  {id:158,g:'中',name:'ニラと豚肉の炒め',time:10,tags:['大豆'],ing:[['豚薄切り肉',70,'g'],['ニラ',30,'g'],['もやし',30,'g'],['醤油',4,'ml',1],['酒',4,'ml',1],['鶏がらスープの素',1,'g',1],['ごま油',3,'ml']],steps:['豚肉を炒め、ニラともやしを加えて強火で手早く炒める。','醤油・酒・鶏がらの素で味をつけ、ごま油を回しかける。']},
  {id:159,g:'中',name:'そら豆と豚の炒め',time:15,tags:['大豆'],ing:[['そら豆（さやむき）',40,'g'],['豚バラ薄切り',60,'g'],['長ねぎ',10,'g'],['醤油',4,'ml',1],['酒',4,'ml',1],['鶏がらスープの素',1,'g',1],['ごま油',3,'ml']],steps:['そら豆は茹でて薄皮をむく。','豚肉とねぎを炒め、そら豆と調味料を加えて手早く絡める。']}

  {id:161,g:'和',name:'鮭ときのこのホイル焼き',time:20,tags:['大豆'],ing:[['生鮭',100,'g'],['しめじ',30,'g'],['えのき',20,'g'],['バター',5,'g'],['醤油',3,'ml',1],['酒',5,'ml',1],['塩',0.5,'g',1]],steps:['鮭に塩をふり、きのこと一緒にアルミホイルで包む。バター・醤油・酒を加える。','オーブントースターかフライパンの蓋で約15分蒸し焼きにする。']},
  {id:162,g:'和',name:'豚と白菜の重ね蒸し',time:20,tags:['大豆'],ing:[['豚バラ薄切り',80,'g'],['白菜',100,'g'],['ポン酢',15,'ml',1],['ごま油',2,'ml'],['にんじん',10,'g']],steps:['白菜と豚肉、にんじんを交互に重ねて鍋に入れる。','蓋をして中火で10分ほど蒸し、ポン酢をかけていただく。']},
  {id:163,g:'和',name:'鶏だんごのスープ',time:25,tags:['卵','大豆'],ing:[['鶏ひき肉',80,'g'],['卵',0.3,'個'],['片栗粉',3,'g'],['生姜',2,'g'],['だし汁',200,'ml'],['醤油',3,'ml',1],['塩',0.5,'g',1],['小松菜',20,'g'],['にんじん',10,'g']],steps:['ひき肉に卵・片栗粉・生姜を混ぜ、一口大に丸める。','だし汁で野菜と鶏だんごを煮て、醤油と塩で味を整える。']},
  {id:164,g:'和',name:'いかと大根の煮物',time:25,tags:['大豆'],ing:[['いか',80,'g'],['大根',80,'g'],['だし汁',150,'ml'],['醤油',8,'ml',1],['みりん',6,'ml',1],['砂糖',4,'g',1],['生姜',2,'g']],steps:['大根は1cm幅のいちょう切りにし、下ゆでする。いかは胴を輪切りにする。','だし汁と調味料で大根を柔らかく煮て、いかを入れてさっと煮る。']},
  {id:165,g:'和',name:'ふろふき大根',time:30,tags:['大豆'],ing:[['大根',120,'g'],['だし汁',150,'ml'],['みりん',5,'ml',1],['醤油',3,'ml',1],['味噌',5,'g',1],['砂糖',2,'g',1],['ゆず皮',1,'g']],steps:['大根は2cm厚さに切り、米のとぎ汁で下ゆでする。','だし汁で柔らかく煮て器に盛り、甘味噌をかけてゆず皮を添える。']},
  {id:166,g:'和',name:'切り干し大根の煮物',time:20,tags:['大豆'],ing:[['切り干し大根',15,'g'],['にんじん',10,'g'],['油揚げ',10,'g'],['だし汁',100,'ml'],['醤油',6,'ml',1],['みりん',5,'ml',1],['砂糖',3,'g',1],['サラダ油',3,'ml']],steps:['切り干し大根は水で戻して絞る。にんじんと油揚げは細切りにする。','油で炒めてだし汁と調味料を加え、汁気がなくなるまで煮る。']},
  {id:167,g:'和',name:'しらすと大根おろしの和え物',time:5,tags:['大豆'],ing:[['しらす',20,'g'],['大根おろし',50,'g'],['醤油',3,'ml',1],['すだち',0.5,'個'],['小ねぎ',3,'g']],steps:['大根おろしの水気を軽く切る。','しらすと大根おろしを合わせ、醤油をかけて小ねぎを散らす。すだちを添える。']},

  {id:169,g:'和',name:'とんかつ',time:25,tags:['卵','小麦'],ing:[['豚ロース',100,'g'],['小麦粉',5,'g'],['溶き卵',0.5,'個'],['パン粉',15,'g'],['塩',0.5,'g',1],['揚げ油',30,'ml'],['キャベツ',40,'g'],['ソース',10,'ml',1]],steps:['豚肉に塩こしょうをし、小麦粉・溶き卵・パン粉の順につける。','170℃の油で約5分揚げ、食べやすく切ってキャベツとソースを添える。']},

  {id:171,g:'和',name:'きゅうりの浅漬け',time:10,tags:[],ing:[['きゅうり',1,'本'],['塩',1,'g',1],['昆布',2,'g'],['だし汁',20,'ml']],steps:['きゅうりは食べやすく切り、塩でもんで10分おく。','昆布とだし汁を加えて冷蔵庫で30分以上漬ける。']},
  {id:172,g:'和',name:'ほっけの塩焼き',time:20,tags:[],ing:[['ほっけの開き',1,'枚'],['塩',0.5,'g',1],['大根おろし',30,'g']],steps:['ほっけは塩をふって10分おく。','グリルで皮目から焼き、こんがりしたら大根おろしを添える。']},
  {id:173,g:'和',name:'れんこんのきんぴら',time:15,tags:['大豆'],ing:[['れんこん',60,'g'],['ごま油',3,'ml'],['醤油',5,'ml',1],['みりん',4,'ml',1],['砂糖',3,'g',1],['赤唐辛子',0.2,'本',1],['白ごま',1,'g']],steps:['れんこんは薄いいちょう切りにして水にさらす。','ごま油で炒め、調味料と唐辛子で汁気がなくなるまで炒め煮にし、白ごまを振る。']},
  {id:174,g:'洋',name:'ハッシュドビーフ',time:30,tags:['小麦','乳'],ing:[['牛薄切り肉',80,'g'],['玉ねぎ',25,'g'],['マッシュルーム',20,'g'],['バター',5,'g'],['小麦粉',4,'g'],['トマト缶',40,'g'],['赤ワイン',10,'ml'],['水',100,'ml'],['コンソメ',2,'g',1],['ウスターソース',5,'ml',1]],steps:['バターで玉ねぎとマッシュルームを炒め、牛肉と小麦粉を加える。','トマト缶・ワイン・水・コンソメを加えて20分ほど煮て、ソースで味を整える。']},
  {id:175,g:'洋',name:'ひき肉のドリア',time:30,tags:['乳','小麦'],ing:[['ご飯',150,'g'],['合挽き肉',50,'g'],['玉ねぎ',20,'g'],['バター',5,'g'],['小麦粉',4,'g'],['牛乳',100,'ml'],['ピザ用チーズ',20,'g'],['塩',0.5,'g',1],['ケチャップ',5,'g',1]],steps:['バターで玉ねぎと肉を炒め、小麦粉・牛乳を加えてホワイトソースを作る。','耐熱皿にご飯と具を入れ、ソースとチーズをのせてオーブンで焼き色をつける。']},
  {id:176,g:'洋',name:'ポテトのオーブン焼き',time:35,tags:[],ing:[['じゃがいも',1,'個'],['オリーブオイル',5,'ml'],['ローズマリー',0.2,'g'],['塩',0.5,'g',1],['黒こしょう',0.3,'g',1],['ニンニク',1,'g']],steps:['じゃがいもをくし形に切り、オイル・塩・ニンニク・ローズマリーで和える。','200℃のオーブンで、表面がカリッとするまで30分ほど焼く。']},
  {id:177,g:'洋',name:'キャロットラペ',time:10,tags:[],ing:[['にんじん',60,'g'],['レーズン',5,'g'],['オリーブオイル',5,'ml'],['レモン汁',3,'ml'],['塩',0.3,'g',1],['砂糖',2,'g',1]],steps:['にんじんを千切りにし、塩を少しふって5分おく。','レーズン・オイル・レモン汁・砂糖で和え、冷蔵庫で味をなじませる。']},
  {id:178,g:'洋',name:'チキンのレモンバター焼き',time:20,tags:['乳','小麦'],ing:[['鶏もも肉',100,'g'],['小麦粉',3,'g'],['バター',8,'g'],['レモン汁',5,'ml'],['塩',0.5,'g',1],['黒こしょう',0.3,'g',1],['ブロッコリー',40,'g']],steps:['鶏肉に塩こしょうをし、小麦粉を薄くまぶす。皮目から焼いて火を通す。','バターとレモン汁を加えてからめ、茹でたブロッコリーを添える。']},
  {id:179,g:'洋',name:'ポークビンダルー',time:40,tags:[],ing:[['豚肩ロース',100,'g'],['玉ねぎ',20,'g'],['ニンニク',2,'g'],['トマト缶',60,'g'],['赤ワインビネガー',8,'ml',1],['カレー粉',2,'g',1],['オリーブオイル',5,'ml'],['水',50,'ml'],['塩',0.5,'g',1]],steps:['豚肉を酢・カレー粉・ニンニクに30分ほど漬ける。','オイルで肉と玉ねぎを炒め、トマト缶と水を加えて弱火で30分煮る。塩で味を整える。']},
  {id:180,g:'洋',name:'アボカドとえびのサラダ',time:10,tags:['えび'],ing:[['むきえび',50,'g'],['アボカド',0.5,'個'],['レタス',40,'g'],['玉ねぎ',10,'g'],['オリーブオイル',5,'ml'],['レモン汁',3,'ml'],['塩',0.3,'g',1]],steps:['えびは塩茹でして冷ます。アボカドは角切りにする。','レタスと玉ねぎを盛り、えび・アボカドをのせて、オイルとレモン汁・塩をかける。']},
  {id:181,g:'洋',name:'ツナのオムレツ',time:10,tags:['卵','乳'],ing:[['卵',2,'個'],['ツナ缶',20,'g'],['牛乳',10,'ml'],['バター',5,'g'],['塩',0.5,'g',1],['黒こしょう',0.2,'g',1]],steps:['卵と牛乳、塩こしょうを混ぜ、油を溶かしたフライパンに流す。','ツナを中央にのせ、半熟で折りたたんで盛る。']},
  {id:182,g:'中',name:'ピータン豆腐',time:10,tags:['卵','大豆'],ing:[['絹ごし豆腐',100,'g'],['ピータン',0.5,'個'],['長ねぎ',5,'g'],['醤油',5,'ml',1],['ごま油',3,'ml'],['生姜',2,'g'],['酢',3,'ml',1]],steps:['豆腐は水気を切って器に盛り、ピータンを崩してのせる。','千切りの生姜と長ねぎを散らし、醤油・酢・ごま油をかける。']},
  {id:183,g:'中',name:'きくらげと卵の炒め',time:10,tags:['卵','大豆'],ing:[['卵',1,'個'],['きくらげ',5,'g'],['ニラ',10,'g'],['醤油',4,'ml',1],['鶏がらスープの素',1,'g',1],['ごま油',3,'ml']],steps:['きくらげは戻して千切りにする。卵を溶いて炒め、取り出す。','ごま油できくらげとニラを炒め、卵を戻して醤油と鶏がらで味を整える。']},
  {id:184,g:'中',name:'鶏の香味ソース',time:20,tags:['大豆'],ing:[['鶏むね肉',100,'g'],['長ねぎ',10,'g'],['生姜',2,'g'],['醤油',6,'ml',1],['酢',4,'ml',1],['砂糖',3,'g',1],['ごま油',3,'ml'],['ラー油',1,'ml',1]],steps:['鶏むね肉は酒蒸しにして冷まし、食べやすく裂く。','長ねぎ・生姜・調味料を混ぜた香味ソースを作り、鶏肉にかける。']},
  {id:185,g:'中',name:'えび団子のスープ',time:20,tags:['えび','卵'],ing:[['むきえび',60,'g'],['片栗粉',3,'g'],['卵',0.3,'個'],['小松菜',20,'g'],['水',200,'ml'],['鶏がらスープの素',2,'g',1],['塩',0.5,'g',1],['ごま油',2,'ml']],steps:['えびは粗く刻み、片栗粉と卵を混ぜて丸める。','鶏がらスープの素で水を煮立て、えび団子と小松菜を入れて火を通し、塩とごま油で整える。']},
  {id:186,g:'中',name:'豚のチャーシュー',time:90,tags:['大豆'],ing:[['豚肩ロース',150,'g'],['醤油',10,'ml',1],['酒',10,'ml',1],['砂糖',5,'g',1],['生姜',3,'g'],['長ねぎの青い部分',10,'g'],['水',100,'ml']],steps:['豚肉をタコ糸で縛り、調味料と生姜・ねぎ・水を入れて鍋で煮る。','弱火で40分ほど煮て、冷めるまで漬け汁につけて味を含ませる。']},
  {id:187,g:'中',name:'ザーサイと豚肉の炒め',time:10,tags:['大豆'],ing:[['豚バラ薄切り',60,'g'],['ザーサイ',15,'g'],['長ねぎ',10,'g'],['酒',5,'ml',1],['醤油',3,'ml',1],['ごま油',3,'ml']],steps:['ザーサイは水で塩気を抜き、千切りにする。','ごま油で豚肉とねぎを炒め、ザーサイを加えて酒と醤油で味を整える。']},
  {id:188,g:'中',name:'五目炒飯',time:15,tags:['卵','大豆'],ing:[['ご飯',150,'g'],['卵',1,'個'],['チャーシュー',20,'g'],['ニラ',10,'g'],['にんじん',10,'g'],['醤油',4,'ml',1],['鶏がらスープの素',1,'g',1],['ごま油',5,'ml']],steps:['卵をご飯と混ぜ、ごま油で強火でパラリと炒める。','具材を加えて炒め、醤油と鶏がらで味を整える。']},
  {id:189,g:'中',name:'クラゲの和え物',time:10,tags:['大豆'],ing:[['クラゲ（塩蔵）',40,'g'],['きゅうり',20,'g'],['ごま油',3,'ml'],['醤油',4,'ml',1],['酢',3,'ml',1],['砂糖',2,'g',1],['白ごま',1,'g']],steps:['クラゲは塩抜きして食べやすく切る。きゅうりは千切りにする。','調味料で和え、白ごまを振る。']}

  {id:191,g:'和',name:'鶏の塩麹焼き',time:20,tags:[],ing:[['鶏もも肉',100,'g'],['塩麹',10,'g',1],['サラダ油',3,'ml'],['レモン',10,'g']],steps:['鶏肉に塩麹をもみ込み、30分以上おく。','フライパンで皮目から焼き、中まで火を通す。レモンを添える。']},

  {id:193,g:'和',name:'鮭の炊き込みご飯',time:40,tags:['大豆'],ing:[['米',80,'g'],['生鮭',60,'g'],['油揚げ',5,'g'],['にんじん',10,'g'],['醤油',5,'ml',1],['酒',5,'ml',1],['塩',0.5,'g',1]],steps:['米は洗って30分ほど水に浸しておく。','具と調味料を入れて炊き、炊けたら鮭をほぐして混ぜる。']},

  {id:195,g:'和',name:'白身魚のあんかけ',time:20,tags:['大豆','小麦'],ing:[['白身魚',100,'g'],['片栗粉',5,'g'],['醤油',5,'ml',1],['みりん',5,'ml',1],['だし汁',100,'ml'],['生姜',2,'g'],['ピーマン',10,'g']],steps:['白身魚に片栗粉をまぶし、焼くか揚げる。','だし汁と調味料を煮立て、水溶き片栗粉でとろみをつけ、生姜と野菜を加えてかける。']},
  {id:196,g:'和',name:'かぼちゃのサラダ',time:15,tags:['卵'],ing:[['かぼちゃ',80,'g'],['玉ねぎ',10,'g'],['ハム',10,'g'],['マヨネーズ',10,'g',1],['塩',0.3,'g',1]],steps:['かぼちゃは皮をむいて一口大に切り、レンジや茹でて柔らかくする。','熱いうちにつぶし、玉ねぎ・ハムと合わせてマヨネーズで和える。']},
  {id:197,g:'和',name:'れんこんのはさみ焼き',time:25,tags:['大豆','小麦'],ing:[['れんこん',80,'g'],['鶏ひき肉',50,'g'],['醤油',4,'ml',1],['みりん',4,'ml',1],['片栗粉',3,'g'],['サラダ油',5,'ml']],steps:['れんこんは5mm幅の輪切りにし、半分に水にさらす。','肉を挟み、片栗粉をまぶして焼く。両面が焼けたら調味料をからめる。']},
  {id:198,g:'和',name:'豚しゃぶの酢味噌和え',time:15,tags:['大豆'],ing:[['豚しゃぶ用肉',80,'g'],['きゅうり',20,'g'],['わかめ（塩蔵）',5,'g'],['味噌',5,'g',1],['酢',5,'ml',1],['砂糖',3,'g',1],['みりん',3,'ml',1]],steps:['豚肉は湯にくぐらせて冷まし、食べやすく切る。','きゅうりとわかめを切り、酢味噌を作って和える。']},
  {id:199,g:'和',name:'いなり寿司',time:30,tags:['大豆','小麦'],ing:[['油揚げ',2,'枚'],['ご飯',150,'g'],['酢',5,'ml',1],['砂糖',5,'g',1],['醤油',5,'ml',1],['だし汁',60,'ml'],['白ごま',1,'g']],steps:['油揚げは熱湯で油抜きし、だし・醤油・砂糖で煮含める。','ご飯に酢と砂糖を混ぜて酢飯にし、油揚げに詰めて白ごまを振る。']},
  {id:200,g:'和',name:'おからの炒り煮',time:20,tags:['大豆','卵'],ing:[['おから',60,'g'],['にんじん',10,'g'],['干ししいたけ',2,'g'],['油揚げ',5,'g'],['醤油',5,'ml',1],['砂糖',4,'g',1],['だし汁',60,'ml'],['サラダ油',3,'ml']],steps:['にんじん・しいたけ・油揚げを細切りにし、油で炒める。','おからとだし汁、調味料を加え、水気がなくなるまで炒り煮にする。']},
  {id:201,g:'和',name:'鶏手羽の甘辛煮',time:30,tags:['大豆'],ing:[['鶏手羽元',3,'本'],['醤油',8,'ml',1],['みりん',8,'ml',1],['砂糖',5,'g',1],['水',100,'ml'],['生姜',3,'g']],steps:['手羽元は皮目に切り込みを入れ、サッと湯通しする。','水と調味料、生姜を入れ、落としぶたをして弱火で20分煮る。']},
  {id:202,g:'和',name:'さわらの幽庵焼き',time:20,tags:['大豆'],ing:[['さわら切り身',100,'g'],['醤油',6,'ml',1],['みりん',6,'ml',1],['酒',3,'ml',1],['柚子',5,'g']],steps:['醤油・みりん・酒を合わせ、さわらを30分ほど漬ける。','グリルで焼き、柚子の皮をすりおろして添える。']},
  {id:203,g:'和',name:'根菜の白和え',time:20,tags:['大豆'],ing:[['絹ごし豆腐',60,'g'],['にんじん',15,'g'],['ごぼう',15,'g'],['こんにゃく',20,'g'],['砂糖',3,'g',1],['醤油',3,'ml',1],['白練りごま',5,'g']],steps:['野菜を細切りにして下茹でし、調味料で味を含ませる。','豆腐を水切りしてすり鉢でなめらかにし、練りごまと砂糖・醤油で和えてから野菜と合わせる。']},
  {id:204,g:'洋',name:'スモークサーモンのマリネ',time:10,tags:[],ing:[['スモークサーモン',50,'g'],['玉ねぎ',15,'g'],['レモン',10,'g'],['オリーブオイル',5,'ml'],['黒こしょう',0.2,'g',1],['ケッパー',2,'g']],steps:['玉ねぎを薄切りにして水にさらし、水気を切る。','サーモンと玉ねぎをレモン汁・オリーブオイル・こしょうで和え、ケッパーを散らす。']},
  {id:205,g:'洋',name:'トマトクリームパスタ',time:20,tags:['乳','小麦'],ing:[['スパゲティ',80,'g'],['トマト',1,'個'],['玉ねぎ',20,'g'],['ベーコン',20,'g'],['生クリーム',40,'ml'],['コンソメ',2,'g',1],['オリーブオイル',5,'ml']],steps:['ベーコンと玉ねぎをオリーブオイルで炒め、トマトを加えて煮る。','生クリームとコンソメを加えて煮詰め、茹でたパスタと絡める。']},
  {id:206,g:'洋',name:'ホワイトビーンのトマト煮',time:25,tags:[],ing:[['ドライパック白インゲン豆',60,'g'],['トマト缶',75,'g'],['玉ねぎ',20,'g'],['ニンニク',1,'g'],['オリーブオイル',5,'ml'],['塩',0.5,'g',1],['ローリエ',0.1,'枚']],steps:['ニンニクと玉ねぎをオイルで炒め、トマト缶とローリエを加える。','インゲン豆と水少々を入れ、弱火で15分煮て塩で味を整える。']},
  {id:207,g:'洋',name:'ブロッコリーのチーズ焼き',time:15,tags:['乳'],ing:[['ブロッコリー',100,'g'],['ベーコン',15,'g'],['ホワイトソース（市販）',40,'g'],['ピザ用チーズ',15,'g'],['塩',0.3,'g',1]],steps:['ブロッコリーは小房に分けて茹で、ベーコンは小さく切って炒める。','耐熱皿に並べてソースとチーズをのせ、オーブンで焼き色がつくまで焼く。']},
  {id:208,g:'洋',name:'なすのパルミジャーナ',time:30,tags:['卵','乳','小麦'],ing:[['なす',1,'本'],['小麦粉',5,'g'],['卵',0.5,'個'],['トマト缶',60,'g'],['ピザ用チーズ',20,'g'],['パルメザンチーズ',5,'g'],['オリーブオイル',10,'ml'],['塩',0.5,'g',1]],steps:['なすは縦に薄切りにして塩水にさらし、水気を拭いて小麦粉と溶き卵をつける。','油で揚げ焼きにし、耐熱皿にトマト缶・なす・チーズを重ねて焼く。']},
  {id:209,g:'洋',name:'ポテトコロッケ',time:40,tags:['卵','小麦'],ing:[['じゃがいも',1,'個'],['合挽き肉',30,'g'],['玉ねぎ',10,'g'],['小麦粉',5,'g'],['卵',0.5,'個'],['パン粉',10,'g'],['塩',0.5,'g',1],['サラダ油',20,'ml']],steps:['じゃがいもを茹でて潰し、炒めた肉と玉ねぎを混ぜて丸く成形する。','小麦粉・溶き卵・パン粉の順に衣をつけ、170℃の油できつね色に揚げる。']},
  {id:210,g:'洋',name:'ホットサンド',time:10,tags:['卵','乳','小麦'],ing:[['食パン',2,'枚'],['ハム',20,'g'],['スライスチーズ',1,'枚'],['卵',0.5,'個'],['マヨネーズ',5,'g',1],['バター',5,'g']],steps:['パンにマヨネーズを塗り、ハム・チーズ・ゆで卵を挟む。','ホットサンドメーカーにバターを塗って挟み、両面をこんがり焼く。']},
  {id:211,g:'中',name:'鶏とじゃがいものオイスター炒め',time:15,tags:['大豆','小麦'],ing:[['鶏もも肉',80,'g'],['じゃがいも',1,'個'],['オイスターソース',6,'g',1],['醤油',3,'ml',1],['酒',5,'ml',1],['片栗粉',3,'g'],['サラダ油',5,'ml']],steps:['じゃがいもは薄切りにして水にさらす。鶏肉は一口大に切って片栗粉をまぶす。','油で鶏肉とじゃがいもを炒め、調味料を加えてからめる。']},
  {id:212,g:'中',name:'きくらげと豚肉の炒め',time:10,tags:['大豆'],ing:[['豚こま切れ',60,'g'],['きくらげ（乾燥）',2,'g'],['ピーマン',10,'g'],['醤油',5,'ml',1],['酒',5,'ml',1],['砂糖',2,'g',1],['ごま油',3,'ml']],steps:['きくらげは水で戻して食べやすく切る。','ごま油で豚肉とピーマン、きくらげを炒め、調味料で味をつける。']},
  {id:213,g:'中',name:'麻婆白菜',time:15,tags:['大豆'],ing:[['白菜',100,'g'],['豚ひき肉',40,'g'],['豆板醤',2,'g',1],['醤油',5,'ml',1],['砂糖',2,'g',1],['水',80,'ml'],['片栗粉',3,'g'],['ごま油',3,'ml']],steps:['白菜は芯と葉に分けて一口大に切る。豚ひき肉と豆板醤を炒める。','白菜と水・調味料を加えて煮て、水溶き片栗粉でとろみをつけ、ごま油をたらす。']},
  {id:214,g:'中',name:'豚肉と小松菜の炒め',time:10,tags:['大豆'],ing:[['豚こま切れ',60,'g'],['小松菜',80,'g'],['にんにく',1,'g'],['醤油',5,'ml',1],['オイスターソース',4,'g',1],['酒',5,'ml',1],['ごま油',3,'ml']],steps:['小松菜は4cm長さに切る。にんにくはみじん切りにする。','ごま油でにんにくと豚肉を炒め、小松菜を加えて手早く調味料で炒める。']},
  {id:215,g:'中',name:'紅茶卵',time:90,tags:['卵','大豆'],ing:[['卵',1,'個'],['紅茶のティーバッグ',0.5,'個'],['醤油',10,'ml',1],['砂糖',5,'g',1],['八角',0.2,'個',1],['水',200,'ml']],steps:['卵は固ゆでにして殻にひびを入れる。','水と紅茶・調味料・八角を煮立て、卵を入れて弱火で10分煮てから冷めるまで漬ける。']},
  {id:216,g:'中',name:'中華風おこわ',time:50,tags:['大豆'],ing:[['もち米',80,'g'],['干ししいたけ',2,'g'],['鶏もも肉',40,'g'],['にんじん',10,'g'],['醤油',5,'ml',1],['オイスターソース',3,'g',1],['酒',5,'ml',1],['水',90,'ml']],steps:['もち米は洗って2時間ほど水に浸す。具は小さく切って調味料で炒める。','もち米と具を水と一緒に炊飯器で炊く。'] },
  {id:217,g:'中',name:'干し豆腐のサラダ',time:10,tags:['大豆'],ing:[['干し豆腐',40,'g'],['きゅうり',20,'g'],['にんじん',10,'g'],['ごま油',3,'ml'],['酢',3,'ml',1],['醤油',3,'ml',1],['砂糖',2,'g',1]],steps:['干し豆腐は熱湯で戻し、細切りにする。きゅうりとにんじんも細切りにする。','酢・醤油・砂糖・ごま油で和える。'] },
  {id:218,g:'中',name:'冷やし中華',time:20,tags:['卵','小麦','大豆'],ing:[['中華麺',1,'玉'],['鶏むね肉',60,'g'],['きゅうり',20,'g'],['トマト',0.5,'個'],['卵',0.5,'個'],['ごまだれ',15,'ml',1],['酢',3,'ml',1],['醤油',3,'ml',1]],steps:['鶏むね肉は蒸すか茹でて裂き、卵は薄焼き卵にして細切りにする。','麺を茹でて冷水で締め、野菜と具をのせてたれをかける。'] },
  {id:219,g:'中',name:'えびと白菜の炒め',time:10,tags:['えび','大豆'],ing:[['むきえび',60,'g'],['白菜',60,'g'],['片栗粉',3,'g'],['酒',5,'ml',1],['醤油',3,'ml',1],['塩',0.5,'g',1],['ごま油',3,'ml']],steps:['えびに片栗粉をまぶし、ブロッコリーは小房に分けて茹でておく。','ごま油でえびとブロッコリーを炒め、酒・醤油・塩で味を整える。']}
,
  {id:220,g:'和',name:'鯛の煎付け',time:25,tags:['大豆'],ing:[['鯛',1,'尾'],['醤油',8,'ml',1],['みりん',8,'ml',1],['砂糖',4,'g',1],['酒',10,'ml',1],['水',100,'ml'],['生姜',3,'g']],steps:['鯛は置きに切り、熱湯でさっと茶をついて臭みを取る。','水と調味料、生姜で約5分煮て、強めの弱火でつゆが出るまで煮る。'] },
  {id:221,g:'和',name:'ふきの煎物',time:20,tags:['大豆'],ing:[['ふき',80,'g'],['油揚げ',10,'g'],['だし汁',100,'ml'],['醤油',5,'ml',1],['みりん',5,'ml',1],['砂糖',3,'g',1]],steps:['ふきは水でさっと茶でて、食べやすい大きさに切る。','だし汁と調味料でふきと油揚げを弱火で約15分煮る。'] },
  {id:222,g:'和',name:'れんこんとひき肉の甘辛焼き',time:25,tags:['大豆','小麦'],ing:[['れんこん',80,'g'],['鶏ひき肉',50,'g'],['醤油',3,'ml',1],['みりん',3,'ml',1],['片栗粉',3,'g'],['サラダ油',4,'ml']],steps:['れんこんは輪切りにして水にさらし、水気を拭いて片栗粉をまぶす。','鶏ひき肉と一緒に挑して、炂めて照りをつける。'] },
  {id:223,g:'和',name:'あさりの酒蒙し',time:15,tags:[],ing:[['あさり',150,'g'],['酒',20,'ml',1],['バター',5,'g'],['塩',0.5,'g',1],['黒こしょう',0.2,'g',1],['にんじん',5,'g']],steps:['あさりは水洗いしてザルにとる。','鐁にバターとにんじんを入れ、酒を加えて蓋をして蒸す。塩とこしょうで味を整える。'] },
  {id:224,g:'和',name:'ちくわの磯炊焎け',time:10,tags:['小麦','卵'],ing:[['ちくわ',1,'本'],['小麦粉',10,'g'],['卵',0.3,'個'],['醤油',2,'ml',1],['青のり',1,'g'],['サラダ油',5,'ml']],steps:['ちくわを一口大に切り、小麦粉と水でつくった衣をつける。','油で両面を焼き、醤油をかけて青のりをふる。'] },
  {id:225,g:'和',name:'わかめと豆腐の酢の物',time:10,tags:['大豆'],ing:[['たけのこ',20,'g'],['こんにゃく',20,'g'],['酢',8,'ml',1],['砂糖',3,'g',1],['醤油',3,'ml',1],['めいんこん',20,'g']],steps:['わかめは水で戻して水気を切り、こんにゃくは細切りにする。','酢・砂糖・醤油で和えて冷やす。'] },
  {id:226,g:'和',name:'鶏と大根のやさしい煮物',time:20,tags:['大豆'],ing:[['鶏ささみ',60,'g'],['大根',40,'g'],['醤油',5,'ml',1],['みりん',5,'ml',1],['砂糖',3,'g',1],['だし汁',100,'ml']],steps:['大根は皮をむいて一口大に切る。','だし汁と調味料で鶏肉と野菜を煮る。'] },
  {id:227,g:'和',name:'ごぼうと鶏の炒め物',time:15,tags:['大豆'],ing:[['ごぼう',40,'g'],['鶏もも肉',60,'g'],['にんじん',20,'g'],['醤油',6,'ml',1],['みりん',4,'ml',1],['砂糖',3,'g',1],['サラダ油',5,'ml']],steps:['ごぼうは皮をこそげ、ささがきにして水にさらす。','油で肉と野菜を炒め、調味料で味をつける。'] },
  {id:228,g:'和',name:'すき焼き',time:25,tags:['卵','大豆'],ing:[['牛薄切り肉',100,'g'],['玉ねぎ',20,'g'],['長ねぎ',15,'g'],['しらたき',20,'g'],['卵',0.5,'個'],['醤油',10,'ml',1],['みりん',10,'ml',1],['砂糖',8,'g',1],['だし汁',30,'ml']],steps:['鉄鍄で玉ねぎと牡肉を炒め、調味料とだし汁を加える。','野菜を加えて煙させ、溶き卵につけて食べる。'] },
  {id:229,g:'洋',name:'ポークロースト',time:60,tags:[],ing:[['豚肩ロースブロック',150,'g'],['ローズマリー',1,'g'],['にんじん',30,'g'],['玉ねぎ',40,'g'],['塩',3,'g',1],['黒こしょう',1,'g',1],['オリーブオイル',5,'ml']],steps:['肉に塩こしょうとローズマリーをすり込んでおく。','オーブンで肉を強火で焼いてから、160℃で約60分焼く。']},
  {id:230,g:'洋',name:'じゃがいものポタージュ',time:25,tags:['乳'],ing:[['じゃがいも',1,'個'],['玉ねぎ',20,'g'],['バター',5,'g'],['牛乳',100,'ml'],['水',100,'ml'],['コンソメ',2,'g',1],['塩',0.3,'g',1]],steps:['玉ねぎとじゃがいもをバターで炒め、水とコンソメで煮る。','ミキサーにかけてなめらかにし、牛乳を加えて温める。']},
  {id:231,g:'洋',name:'白身魚のアクアパッツァ',time:25,tags:[],ing:[['白身魚',100,'g'],['アサリ',30,'g'],['ミニトマト',40,'g'],['オリーブオイル',10,'ml'],['白ワイン',20,'ml',1],['水',50,'ml'],['塩',0.5,'g',1]],steps:['オリーブオイルでニンニクを風味が出るまで熱する。','白身魚を入れて白ワインと水を加え、アサリ・ミニトマトと一緒に〆5分蓋をして蒙す。'] },
  {id:232,g:'洋',name:'トマト煙込みミートボール',time:30,tags:['卵','小麦'],ing:[['合挽き肉',80,'g'],['パン粉',10,'g'],['卵',0.5,'個'],['玉ねぎ',10,'g'],['トマト缶',80,'g'],['コンソメ',1,'g',1],['塩',0.5,'g',1]],steps:['肉、パン粉、卵、みじんの玉ねぎをこねて丸める。','トマト缶とコンソメで煙らしながら中まで火を通す。']}

  {id:233,g:'中',name:'醤油ラーメン',time:20,tags:['小麦','卵','大豆'],ing:[['中華麺',1,'玉'],['鶏もも肉',40,'g'],['長ねぎ',10,'g'],['醤油',8,'ml',1],['鶏がらスープの素',3,'g',1],['水',300,'ml'],['メンマ',10,'g']],steps:['鶏肉と長ねぎを煮てだしを取り、醤油と鶏がらの素でスープを整える。','麺を茹でて器に入れ、スープを注いで鶏肉・メンマ・長ねぎをのせる。']},
  {id:234,g:'中',name:'大根と豚肉の中華煮込み',time:30,tags:['大豆'],ing:[['大根',100,'g'],['豚バラ薄切り',60,'g'],['生姜',3,'g'],['醤油',8,'ml',1],['酒',8,'ml',1],['砂糖',3,'g',1],['水',150,'ml']],steps:['大根は厚めの輪切りにし、豚肉は一口大に切る。','水と調味料、生姜を入れて大根と豚肉を弱火で25分ほど煮る。']},
  {id:235,g:'中',name:'空心菜の炒め物',time:8,tags:['大豆'],ing:[['空心菜',80,'g'],['にんにく',1,'g'],['醤油',3,'ml',1],['オイスターソース',3,'g',1],['サラダ油',5,'ml']],steps:['空心菜は食べやすく切る。','油でにんにくを香りよく炒め、空心菜を強火で手早く炒めて調味料で味をつける。']},
  {id:236,g:'中',name:'鶏の黒酢炒め',time:15,tags:['大豆','小麦'],ing:[['鶏もも肉',100,'g'],['ピーマン',15,'g'],['玉ねぎ',20,'g'],['片栗粉',5,'g'],['黒酢',10,'ml',1],['醤油',5,'ml',1],['砂糖',5,'g',1],['サラダ油',5,'ml']],steps:['鶏肉に片栗粉をまぶして揚げ焼きにし、取り出す。','野菜を炒め、黒酢・醤油・砂糖を加えて煮立て、鶏肉を戻して絡める。']},
  {id:237,g:'中',name:'肉味噌ご飯',time:15,tags:['大豆'],ing:[['ご飯',150,'g'],['豚ひき肉',50,'g'],['甜麺醤',8,'g',1],['醤油',3,'ml',1],['砂糖',3,'g',1],['ごま油',3,'ml'],['長ねぎ',10,'g']],steps:['ごま油で豚ひき肉と長ねぎを炒め、甜麺醤・醤油・砂糖で味をつける。','ご飯に肉味噌をのせて食べる。']},
  {id:238,g:'中',name:'肉団子の甘酢あん',time:30,tags:['卵','小麦','大豆'],ing:[['豚ひき肉',80,'g'],['玉ねぎ',10,'g'],['片栗粉',3,'g'],['卵',0.3,'個'],['酢',10,'ml',1],['砂糖',10,'g',1],['醤油',3,'ml',1],['水',50,'ml'],['サラダ油',10,'ml']],steps:['ひき肉・玉ねぎ・片栗粉・卵を混ぜて丸め、油で揚げ焼きにする。','酢・砂糖・醤油・水を煮立て、水溶き片栗粉でとろみをつけて肉団子に絡める。']},
  {id:239,g:'中',name:'冷麺',time:20,tags:['卵','小麦','大豆'],ing:[['中華麺',1,'玉'],['鶏むね肉',60,'g'],['きゅうり',20,'g'],['ゆで卵',0.5,'個'],['酢',8,'ml',1],['醤油',8,'ml',1],['砂糖',4,'g',1],['鶏がらスープの素',2,'g',1],['水',200,'ml']],steps:['鶏むね肉は茹でて裂き、きゅうりは千切り、卵は半分に切る。','鶏がらの素・水・酢・醤油・砂糖を合わせて冷やしたスープを作り、麺にかけて具をのせる。']},
  {id:240,g:'中',name:'豆苗と鶏のうま煮',time:15,tags:['大豆'],ing:[['鶏もも肉',80,'g'],['豆苗',50,'g'],['醤油',6,'ml',1],['酒',5,'ml',1],['砂糖',2,'g',1],['水',80,'ml'],['片栗粉',3,'g'],['ごま油',2,'ml']],steps:['鶏肉を一口大に切り、ごま油で炒める。水と調味料を加えて煮る。','豆苗を加えてさっと煮て、水溶き片栗粉でとろみをつける。']},
  {id:241,g:'中',name:'ほうれん草の中華炒め',time:8,tags:['大豆'],ing:[['ほうれん草',80,'g'],['ベーコン',15,'g'],['にんにく',1,'g'],['醤油',3,'ml',1],['鶏がらスープの素',1,'g',1],['ごま油',4,'ml']],steps:['ほうれん草は5cm幅に切る。にんにくとベーコンをごま油で炒める。','ほうれん草を加えて強火で炒め、醤油と鶏がらの素で味を整える。']},
  {id:242,g:'中',name:'青梗菜と鶏のオイスター炒め',time:10,tags:['大豆','小麦'],ing:[['鶏もも肉',80,'g'],['青梗菜',60,'g'],['オイスターソース',5,'g',1],['醤油',3,'ml',1],['酒',5,'ml',1],['片栗粉',3,'g'],['ごま油',4,'ml']],steps:['鶏肉に片栗粉をまぶして炒め、火が通ったら取り出す。','青梗菜を炒め、鶏肉を戻してオイスターソース・醤油・酒で味をつける。']}
,
  {id:243,g:'和',name:'さばの酢の物',time:15,tags:[],ing:[['さば（酢締め用）',80,'g'],['きゅうり',20,'g'],['わかめ',3,'g'],['酢',10,'ml',1],['砂糖',4,'g',1],['醤油',3,'ml',1],['生姜',2,'g']],steps:['さばは薄く塩をして酢で締め、皮をはがして薄切りにする。','きゅうりとわかめを合わせ、酢・砂糖・醤油・生姜で作った甘酢で和える。']},
  {id:244,g:'和',name:'鶏と里芋の煮物',time:30,tags:['大豆'],ing:[['鶏もも肉',80,'g'],['里芋',80,'g'],['にんじん',20,'g'],['だし汁',150,'ml'],['醤油',8,'ml',1],['みりん',8,'ml',1],['砂糖',4,'g',1]],steps:['里芋は皮をむいて塩でぬめりを取り、洗って一口大に切る。','鍋に鶏肉と野菜、だし汁と調味料を入れ、落としぶたをして20分ほど煮る。']},
  {id:245,g:'和',name:'かれいの煮付け',time:20,tags:['大豆'],ing:[['かれい切り身',100,'g'],['醤油',8,'ml',1],['みりん',8,'ml',1],['砂糖',5,'g',1],['酒',8,'ml',1],['水',60,'ml'],['生姜',3,'g']],steps:['かれいは熱湯をかけて表面の汚れを取る。','水と調味料、生姜を煮立て、かれいを入れて落としぶたをし、煮汁をかけながら10分ほど煮る。']},
  {id:246,g:'和',name:'なめこのおろし和え',time:5,tags:['大豆'],ing:[['なめこ',50,'g'],['大根おろし',50,'g'],['醤油',3,'ml',1],['ポン酢',5,'ml',1],['小ねぎ',2,'g']],steps:['なめこはさっと茹でて水気をきる。','大根おろしの水気を軽く切り、なめこと合わせて醤油・ポン酢で和え、小ねぎを散らす。']},
  {id:247,g:'和',name:'さつま汁',time:25,tags:['大豆'],ing:[['鶏もも肉',50,'g'],['大根',30,'g'],['にんじん',15,'g'],['ごぼう',10,'g'],['里芋',20,'g'],['だし汁',200,'ml'],['味噌',12,'g',1],['小ねぎ',3,'g']],steps:['野菜と鶏肉を食べやすく切り、だし汁で煮る。','野菜が柔らかくなったら味噌を溶き入れ、小ねぎを散らす。']},
  {id:248,g:'和',name:'かぼちゃの肉詰め',time:30,tags:['卵','小麦','大豆'],ing:[['かぼちゃ',100,'g'],['合挽き肉',60,'g'],['玉ねぎ',10,'g'],['パン粉',5,'g'],['卵',0.3,'個'],['醤油',5,'ml',1],['砂糖',3,'g',1],['みりん',5,'ml',1]],steps:['かぼちゃは種を取り、電子レンジで柔らかくして一部をつぶす。','玉ねぎ・肉・パン粉・卵を混ぜ、かぼちゃに詰めて焼く。調味料を煮詰めてかける。']},
  {id:249,g:'和',name:'ししとうの炒め物',time:8,tags:['大豆'],ing:[['ししとう',60,'g'],['豚こま切れ',50,'g'],['醤油',5,'ml',1],['みりん',4,'ml',1],['砂糖',2,'g',1],['サラダ油',5,'ml']],steps:['ししとうは竹串で数か所穴をあける。','油で豚肉とししとうを炒め、調味料で絡める。']},
  {id:250,g:'和',name:'鶏とれんこんの煮物',time:25,tags:['大豆'],ing:[['鶏もも肉',80,'g'],['れんこん',60,'g'],['だし汁',120,'ml'],['醤油',8,'ml',1],['みりん',8,'ml',1],['砂糖',4,'g',1]],steps:['れんこんは皮をむいて乱切りにし、酢水にさらす。','鶏肉とれんこんを調味料とだし汁で煮て、汁気が少なくなるまで煮詰める。']},
  {id:251,g:'和',name:'きゅうりとわかめの酢の物',time:5,tags:['大豆'],ing:[['きゅうり',60,'g'],['わかめ（乾燥）',2,'g'],['酢',10,'ml',1],['砂糖',3,'g',1],['醤油',3,'ml',1]],steps:['わかめは水で戻して水気を絞る。きゅうりは薄切りにして塩もみする。','酢・砂糖・醤油を合わせ、きゅうりとわかめを和える。']},
  {id:252,g:'和',name:'さわらの味噌焼き',time:20,tags:['大豆'],ing:[['さわら切り身',100,'g'],['味噌',10,'g',1],['みりん',5,'ml',1],['砂糖',3,'g',1],['酒',5,'ml',1]],steps:['味噌・みりん・砂糖・酒を混ぜて、さわらに薄く塗り10分おく。','魚焼きグリルで焦げ目がつくまで焼く。']},
  {id:253,g:'和',name:'こんにゃくの炒り煮',time:20,tags:['大豆'],ing:[['こんにゃく',80,'g'],['にんじん',15,'g'],['ごま油',3,'ml'],['醤油',6,'ml',1],['みりん',5,'ml',1],['砂糖',3,'g',1],['だし汁',30,'ml']],steps:['こんにゃくは下茹でして一口大にちぎる。にんじんは細切りにする。','ごま油で炒め、だし汁と調味料を加えて汁気がなくなるまで炒め煮にする。']},
  {id:254,g:'和',name:'とろろ汁',time:10,tags:['卵','大豆'],ing:[['長いも',80,'g'],['だし汁',150,'ml'],['味噌',10,'g',1],['小ねぎ',3,'g'],['卵黄',0.5,'個']],steps:['長いもはすりおろし、だし汁を少しずつ加えて伸ばす。','味噌を溶き入れて器に盛り、卵黄と小ねぎをのせる。']},
  {id:255,g:'和',name:'鶏の水炊き',time:30,tags:['大豆'],ing:[['鶏もも肉',100,'g'],['白菜',50,'g'],['春菊',20,'g'],['豆腐',50,'g'],['だし昆布',1,'g'],['ポン酢',15,'ml',1],['長ねぎ',10,'g']],steps:['鍋に水と昆布を入れて煮立て、鶏肉・野菜・豆腐を加えて火を通す。','ポン酢をつけていただく。']},
  {id:256,g:'和',name:'いかの塩焼き',time:10,tags:[],ing:[['いか',1,'杯'],['塩',1,'g',1],['レモン',10,'g'],['サラダ油',3,'ml']],steps:['いかは内臓と軟骨を取って胴を開き、水気を拭く。塩を軽くふる。','油を塗ってグリルかフライパンで両面を焼き、レモンを添える。']},
  {id:257,g:'和',name:'さけのちゃんちゃん焼き',time:20,tags:['大豆','乳'],ing:[['生鮭',100,'g'],['キャベツ',50,'g'],['玉ねぎ',20,'g'],['もやし',20,'g'],['味噌',8,'g',1],['砂糖',3,'g',1],['バター',5,'g'],['みりん',5,'ml',1]],steps:['味噌・砂糖・みりんを混ぜておく。野菜は食べやすく切る。','フライパンにバターで鮭と野菜を並べ、味噌だれをかけて蓋をして蒸し焼きにする。']},
  {id:258,g:'和',name:'ごぼうのごま和え',time:15,tags:['大豆'],ing:[['ごぼう',50,'g'],['にんじん',10,'g'],['すりごま',5,'g'],['醤油',4,'ml',1],['砂糖',4,'g',1],['酢',2,'ml',1]],steps:['ごぼうとにんじんは細切りにして茹で、水気をきる。','すりごま・醤油・砂糖・酢で和える。']},
  {id:259,g:'和',name:'かつおのたたき',time:15,tags:[],ing:[['かつお（刺身用）',100,'g'],['玉ねぎ',20,'g'],['にんにく',1,'g'],['ポン酢',15,'ml',1],['小ねぎ',3,'g'],['しょうが',2,'g']],steps:['かつおは表面を強火で炙り、氷水で冷やして水気を拭く。','薄切りの玉ねぎ・にんにく・しょうがをのせ、ポン酢をかけて小ねぎを散らす。']},
  {id:260,g:'洋',name:'シーフードグラタン',time:35,tags:['乳','小麦','えび'],ing:[['むきえび',40,'g'],['いか',20,'g'],['マカロニ',40,'g'],['玉ねぎ',20,'g'],['バター',5,'g'],['小麦粉',5,'g'],['牛乳',100,'ml'],['ピザ用チーズ',20,'g'],['塩',0.5,'g',1]],steps:['マカロニを茹でる。玉ねぎと海鮮をバターで炒める。','小麦粉と牛乳でホワイトソースを作り、具とマカロニを合わせてチーズをのせ、焼き色がつくまで焼く。']},
  {id:261,g:'洋',name:'ボンゴレビアンコ',time:20,tags:['小麦'],ing:[['スパゲティ',80,'g'],['あさり',80,'g'],['にんにく',1,'g'],['白ワイン',20,'ml',1],['オリーブオイル',8,'ml'],['塩',1,'g',1],['パセリ',1,'g']],steps:['あさりは塩水で砂抜きする。にんにくをオイルで炒め、あさりと白ワインを加えて蓋をする。','口が開いたら茹でたパスタを加えて絡め、塩で味を整えてパセリを散らす。']},
  {id:262,g:'洋',name:'ツナとレタスのサンドイッチ',time:10,tags:['小麦','卵'],ing:[['食パン',2,'枚'],['ツナ缶',30,'g'],['レタス',20,'g'],['卵',0.5,'個'],['マヨネーズ',10,'g',1],['塩',0.3,'g',1]],steps:['ゆで卵を作って刻み、ツナ・マヨネーズ・塩と混ぜる。','パンにレタスと具をはさみ、食べやすく切る。']},
  {id:263,g:'洋',name:'タラのソテー',time:15,tags:['小麦'],ing:[['タラ切り身',100,'g'],['塩',1,'g',1],['黒こしょう',0.3,'g',1],['小麦粉',5,'g'],['バター',5,'g'],['レモン',10,'g']],steps:['タラは水気を拭いて塩こしょうをふり、薄く小麦粉をまぶす。','バターで両面をこんがり焼き、レモンを添える。']},
  {id:264,g:'洋',name:'牛肉のトマト煮込み',time:40,tags:['小麦'],ing:[['牛バラ肉',80,'g'],['玉ねぎ',25,'g'],['にんじん',20,'g'],['トマト缶',75,'g'],['赤ワイン',20,'ml',1],['コンソメ',2,'g',1],['塩',1,'g',1],['水',100,'ml']],steps:['牛肉に塩をふり、焼き色をつけて取り出す。野菜を炒める。','赤ワイン・トマト缶・コンソメ・水と肉を加え、弱火で30分ほど煮込む。']},
  {id:265,g:'洋',name:'マッシュポテト',time:15,tags:['乳'],ing:[['じゃがいも',1,'個'],['バター',5,'g'],['牛乳',30,'ml'],['塩',0.5,'g',1],['黒こしょう',0.2,'g',1]],steps:['じゃがいもは茹でて熱いうちに潰す。','バター・牛乳を加えて混ぜ、塩こしょうで味を整える。']},
  {id:266,g:'洋',name:'アスパラのベーコン巻き',time:10,tags:[],ing:[['アスパラガス',60,'g'],['ベーコン',20,'g'],['オリーブオイル',5,'ml'],['黒こしょう',0.3,'g',1]],steps:['アスパラは根元の固い部分を取り、ベーコンを巻く。','オイルで転がしながら焼き、黒こしょうをふる。']},
  {id:267,g:'洋',name:'エッグサラダ',time:10,tags:['卵','乳'],ing:[['卵',1,'個'],['玉ねぎ',10,'g'],['マヨネーズ',12,'g',1],['牛乳',3,'ml'],['塩',0.3,'g',1],['黒こしょう',0.1,'g',1]],steps:['卵は茹でて刻み、玉ねぎは水にさらして水気をきる。','マヨネーズ・牛乳・塩こしょうで和える。']},
  {id:268,g:'洋',name:'かぼちゃのグラタン',time:30,tags:['乳','小麦'],ing:[['かぼちゃ',100,'g'],['玉ねぎ',20,'g'],['バター',5,'g'],['小麦粉',4,'g'],['牛乳',100,'ml'],['ピザ用チーズ',20,'g'],['塩',0.5,'g',1]],steps:['かぼちゃは蒸して潰す。玉ねぎはバターで炒める。','小麦粉と牛乳でホワイトソースを作り、かぼちゃと合わせて器に入れ、チーズをのせて焼く。']},
  {id:269,g:'洋',name:'ミートボールスープ',time:30,tags:['小麦','卵'],ing:[['合挽き肉',50,'g'],['玉ねぎ',10,'g'],['パン粉',5,'g'],['卵',0.3,'個'],['キャベツ',30,'g'],['コンソメ',3,'g',1],['水',250,'ml'],['塩',0.5,'g',1]],steps:['肉・玉ねぎ・パン粉・卵を練り、小さく丸める。','水とコンソメを煮立てて肉団子とキャベツを入れ、火が通ったら塩で味を整える。']},
  {id:270,g:'洋',name:'ベーコンとキャベツのスープ',time:15,tags:[],ing:[['ベーコン',20,'g'],['キャベツ',60,'g'],['玉ねぎ',20,'g'],['水',250,'ml'],['コンソメ',3,'g',1],['塩',0.5,'g',1],['黒こしょう',0.2,'g',1]],steps:['ベーコン・野菜を切り、ベーコンと玉ねぎを炒める。','水とコンソメを加えてキャベツを煮て、塩こしょうで味を整える。']},
  {id:271,g:'洋',name:'マカロニサラダ',time:20,tags:['卵','乳'],ing:[['マカロニ',40,'g'],['ハム',15,'g'],['きゅうり',20,'g'],['玉ねぎ',10,'g'],['卵',0.5,'個'],['マヨネーズ',15,'g',1],['塩',0.5,'g',1]],steps:['マカロニは表示どおり茹で、冷水で冷ます。','野菜とハムを切って塩もみし、ゆで卵・マヨネーズと和える。']},
  {id:272,g:'洋',name:'フリッタータ',time:20,tags:['卵','乳'],ing:[['卵',2,'個'],['ベーコン',20,'g'],['じゃがいも',30,'g'],['ピーマン',10,'g'],['牛乳',10,'ml'],['粉チーズ',5,'g'],['塩',0.5,'g',1],['オリーブオイル',5,'ml']],steps:['ベーコンとじゃがいも・ピーマンをオイルで炒める。','卵・牛乳・チーズ・塩を混ぜて流し入れ、蓋をして弱火で焼く。表面が固まったら完成。']},
  {id:273,g:'洋',name:'チキンのガーリックソテー',time:20,tags:[],ing:[['鶏もも肉',100,'g'],['にんにく',2,'g'],['オリーブオイル',8,'ml'],['塩',1,'g',1],['黒こしょう',0.3,'g',1],['白ワイン',10,'ml',1]],steps:['鶏肉に塩こしょうをふり、皮目から焼く。','にんにくを加えて香りを出し、白ワインを回しかけて火を通す。']},

let settings = null;
let draft = null;
let genre = 'all';
let current = [];
const kept = new Set();           // キープ（チェック）したメニューのid
const RECENT_KEY = 'dinnerMenuRecent';
const RECENT_MAX = 20;            // 直近に提示したメニューを何件まで除外するか
let recent = loadRecent();
function loadRecent(){
  try{
    const r = JSON.parse(localStorage.getItem(RECENT_KEY));
    if(Array.isArray(r)) return r;
  }catch(e){}
  return [];
}
function saveRecent(r){
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(r)); }catch(e){}
}

/* ---------- 保存・読み込み ---------- */
function loadSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.settingsVersion === 1) return s;
  }catch(e){}
  return null;
}
function saveSettings(s){
  try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){}
}

/* ---------- 画面切り替え ---------- */
function showView(name){
  document.getElementById('setup').hidden = (name !== 'setup');
  document.getElementById('main').hidden = (name !== 'main');
}

/* ---------- 初期設定画面 ---------- */
function openSetup(isFirst){
  draft = settings ? JSON.parse(JSON.stringify(settings)) : {settingsVersion:1, people:2, allergies:[[],[]]};
  document.getElementById('btnBack').hidden = isFirst;
  renderSetup();
  showView('setup');
}
function renderSetup(){
  const peopleBox = document.getElementById('peopleSel');
  peopleBox.innerHTML = [1,2,3,4,5,6].map(n =>
    `<button class="ghost ${draft.people===n?'sel':''}" data-n="${n}">${n}人</button>`).join('');
  peopleBox.querySelectorAll('button').forEach(b => b.onclick = () => {
    draft.people = +b.dataset.n;
    while(draft.allergies.length < draft.people) draft.allergies.push([]);
    renderSetup();
  });

  const area = document.getElementById('allergyArea');
  area.innerHTML = Array.from({length: draft.people}, (_, i) => `
    <div class="panel">
      <h3>${i+1}人目</h3>
      <div class="row">${ALLERGENS.map(a =>
        `<label class="chk"><input type="checkbox" data-i="${i}" value="${a}" ${draft.allergies[i].includes(a)?'checked':''}>${a}</label>`
      ).join('')}</div>
    </div>`).join('');
  area.querySelectorAll('input').forEach(c => c.onchange = () => {
    const set = new Set(draft.allergies[+c.dataset.i]);
    c.checked ? set.add(c.value) : set.delete(c.value);
    draft.allergies[+c.dataset.i] = [...set];
  });
}
document.getElementById('btnSaveSetup').onclick = () => {
  settings = JSON.parse(JSON.stringify(draft));
  settings.allergies = settings.allergies.slice(0, settings.people);
  saveSettings(settings);
  openMain();
};
document.getElementById('btnBack').onclick = openMain;
document.getElementById('btnSettings').onclick = () => openSetup(false);

/* ---------- メイン画面 ---------- */
function openMain(){
  renderTabs();
  showView('main');
  pickMenus();
}
function renderTabs(){
  document.getElementById('genreTabs').innerHTML = Object.keys(GENRE_LABEL).map(g =>
    `<button class="${genre===g?'sel':''}" data-g="${g}">${GENRE_LABEL[g]}</button>`).join('');
  document.querySelectorAll('#genreTabs button').forEach(b => b.onclick = () => {
    genre = b.dataset.g;
    kept.clear();
    renderTabs();
    pickMenus();
  });
}
function shuffle(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickMenus(){
  const banned = new Set(settings.allergies.flat());
  const genreMatch = DATA.filter(d => genre === 'all' || d.g === genre);
  const pool = genreMatch.filter(d => !d.tags.some(t => banned.has(t)));
  const excluded = genreMatch.length - pool.length;
  // キープ中のメニューは残し、残りを直近の提示を避けて選ぶ
  const keep = current.filter(d => kept.has(d.id) && pool.includes(d));
  const need = 10 - keep.length;
  const keepIds = new Set(keep.map(d => d.id));
  const notKept = pool.filter(d => !keepIds.has(d.id));
  let fresh = notKept.filter(d => !recent.includes(d.id));
  const relaxed = fresh.length < need;   // 候補が足りない時だけ直近も含める
  if(relaxed) fresh = notKept;
  const added = shuffle(fresh).slice(0, need);
  current = [...keep, ...added];
  recent = [...new Set([...added.map(d => d.id), ...recent])].slice(0, RECENT_MAX);
  saveRecent(recent);
  renderList();
  document.getElementById('btnPick').textContent = kept.size ? 'キープ以外を入れ替える' : '10件提示する';
  document.getElementById('info').textContent =
    `候補 ${pool.length}品から ${current.length}件を提示` +
    (keep.length ? `（キープ${keep.length}件を含む）` : '') +
    (relaxed ? '（候補が少ないため直近の料理も含みます）' : '') +
    (excluded ? `（アレルギー等で ${excluded}品を除外）` : '');
}
function renderList(){
  const list = document.getElementById('menuList');
  if(current.length === 0){
    list.innerHTML = '<p class="muted">条件に合うメニューがありません。設定を見直してください。</p>';
    return;
  }
  list.innerHTML = current.map(d => `
    <div class="card" data-id="${d.id}">
      <div><span class="genre">${d.g}</span><span class="name">${d.name}</span> <span class="muted">約${d.time}分</span></div>
      <label class="chk" onclick="event.stopPropagation()"><input type="checkbox" data-keep="${d.id}" ${kept.has(d.id)?'checked':''}>キープ</label>
    </div>`).join('');
  list.querySelectorAll('.card').forEach(c => c.onclick = () => openRecipe(+c.dataset.id));
  list.querySelectorAll('input[data-keep]').forEach(i => i.onchange = () => {
    const id = +i.dataset.keep;
    i.checked ? kept.add(id) : kept.delete(id);
    document.getElementById('btnPick').textContent = kept.size ? 'キープ以外を入れ替える' : '10件提示する';
  });
}
document.getElementById('btnPick').onclick = pickMenus;

/* ---------- 人数で分量を計算 ---------- */
function fmt(v){
  return Number.isInteger(v) ? String(v) : v.toFixed(1).replace(/\.0$/, '');
}
function scaleAmt(ing, n){
  const [name, amt, unit, cond] = ing;
  const factor = cond ? 1 + (n - 1) * 0.8 : n;   // 調味料は控えめに増量
  return `${name} ${fmt(Math.round(amt * factor * 10) / 10)}${unit}`;
}

  document.getElementById('sheet').innerHTML = `

    <h3>材料</h3>
    <ul>${d.ing.map(i => `<li>${scaleAmt(i, n)}</li>`).join('')}</ul>
    <h3>作り方</h3>
    <ol>${d.steps.map(s => `<li>${s}</li>`).join('')}</ol>
    <p class="muted">※調味料は人数に合わせて控えめに増量しています。</p>
    <button id="btnClose" style="width:100%;margin-top:12px">閉じる</button>`;
  document.getElementById('btnClose').onclick = closeRecipe;
  document.getElementById('overlay').classList.add('open');
}
function closeRecipe(){
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').onclick = e => {
  if(e.target.id === 'overlay') closeRecipe();
};

/* ---------- 起動 ---------- */
settings = loadSettings();
if(settings){
  openMain();
}else{
  openSetup(true);
}
</script>
</body>
</html>
